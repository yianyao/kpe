[project]
name = "kpe"
version = "0.2.0"
description = "Extract self-contained knowledge points from long books (PDF/Markdown/plain text)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "yianyao" }]
requires-python = ">=3.10"
dependencies = ["pdfplumber>=0.11"]
keywords = ["knowledge-extraction", "llm", "pdf", "chunking", "notes"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://github.com/yianyao/kpe"
Source = "https://github.com/yianyao/kpe"

[project.scripts]
kpe = "kpe.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kpe"]

[tool.pytest.ini_options]
testpaths = ["tests"]